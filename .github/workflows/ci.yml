name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prüfpakete installieren
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck libxml2-utils
      - name: Bash-Syntax
        run: bash -n safebox install/*.sh network/*.sh guest/*.sh tests/*.sh tools/*.sh
      - name: ShellCheck
        run: shellcheck safebox install/*.sh network/*.sh guest/*.sh tests/*.sh tools/*.sh
      - name: XML prüfen
        run: xmllint --noout network/safebox-net.xml vm/templates/*.xml.in
      - name: VM-Sicherheitsrichtlinie statisch prüfen
        run: ./tests/static-policy.sh
      - name: Netzwerk-Policy prüfen
        run: ./tests/network-policy.sh
      - name: Templates rendern
        run: ./tests/render-smoke.sh
