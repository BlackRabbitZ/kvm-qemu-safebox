name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Browser uploads and Windows Git checkouts can lose Unix +x bits.
      # Restore a known, restricted set before the release policy verifies them.
      - name: Normalize executable file modes
        run: bash tools/normalize-executable-bits.sh

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck libxml2-utils libvirt-clients
      - name: Bash syntax
        run: bash -n safebox install/*.sh host/*.sh network/*.sh guest/*.sh tools/*.sh tests/*.sh
      - name: ShellCheck
        run: make lint
      - name: Policy tests
        run: make release-check
