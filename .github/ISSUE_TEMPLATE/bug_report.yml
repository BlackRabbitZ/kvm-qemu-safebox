name: Fehlerbericht
description: Reproduzierbaren Fehler melden
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Keine ungepatchten Sicherheitslücken öffentlich melden – dafür GitHub Security Advisories verwenden."
  - type: input
    id: version
    attributes:
      label: SafeBox-Version/Commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Host-Umgebung
      description: Distribution, Kernel, QEMU, libvirt
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduktionsschritte
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Tatsächliches und erwartetes Verhalten
    validations:
      required: true
