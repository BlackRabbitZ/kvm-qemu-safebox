# KVM-QEMU-SafeBox v0.5.1-rc5 defaults
# RC4: malware analysis uses only offline, non-persistent VMs. No runtime NIC.
SAFEBOX_VERSION="0.5.1-rc5"
SAFEBOX_CONNECT_URI="qemu:///system"
SAFEBOX_PROFILE="${SAFEBOX_PROFILE:-hardened}"

SAFEBOX_STORAGE="/var/lib/safebox"
SAFEBOX_SESSIONS_DIR="$SAFEBOX_STORAGE/sessions"
SAFEBOX_BASE_IMAGE="$SAFEBOX_STORAGE/debian13-xfce-base.qcow2"
SAFEBOX_BASE_HASH="$SAFEBOX_STORAGE/debian13-xfce-base.qcow2.sha256"
SAFEBOX_BASE_META="$SAFEBOX_STORAGE/debian13-xfce-base.meta.json"
SAFEBOX_PERSISTENT_IMAGE="$SAFEBOX_STORAGE/persistent.qcow2"
SAFEBOX_PERSISTENT_META="$SAFEBOX_STORAGE/persistent.meta.json"
SAFEBOX_INSTALL_ISO="$SAFEBOX_STORAGE/installer.iso"
SAFEBOX_RUNTIME_DIR="/run/safebox"
SAFEBOX_LOCK_FILE="/run/lock/kvm-qemu-safebox.lock"

SAFEBOX_DISK_SIZE="50G"
SAFEBOX_RAM_MIB="${SAFEBOX_RAM_MIB:-6144}"
SAFEBOX_VCPUS="${SAFEBOX_VCPUS:-4}"
SAFEBOX_MEM_HARD_MIB="${SAFEBOX_MEM_HARD_MIB:-8192}"
SAFEBOX_IOTHREADS="${SAFEBOX_IOTHREADS:-1}"

# Stable: hard resource limits.
SAFEBOX_CPU_PERIOD_US="${SAFEBOX_CPU_PERIOD_US:-100000}"
SAFEBOX_CPU_MAX_PERCENT="${SAFEBOX_CPU_MAX_PERCENT:-70}"
SAFEBOX_DISK_TOTAL_BYTES_SEC="${SAFEBOX_DISK_TOTAL_BYTES_SEC:-134217728}"
SAFEBOX_DISK_TOTAL_IOPS_SEC="${SAFEBOX_DISK_TOTAL_IOPS_SEC:-12000}"
SAFEBOX_MIN_FREE_GIB="${SAFEBOX_MIN_FREE_GIB:-10}"
SAFEBOX_RUNTIME_MIN_FREE_GIB="${SAFEBOX_RUNTIME_MIN_FREE_GIB:-5}"
SAFEBOX_OVERLAY_MAX_GIB="${SAFEBOX_OVERLAY_MAX_GIB:-55}"
SAFEBOX_SAMPLE_MAX_MIB="256"
# A mounted LUKS-backed filesystem (or ephemeral tmpfs without swap) is required.
SAFEBOX_REQUIRE_ENCRYPTED_STORAGE="1"

SAFEBOX_VERIFY_BASE_HASH="1"
SAFEBOX_WATCH_INTERVAL="${SAFEBOX_WATCH_INTERVAL:-5}"
SAFEBOX_NETWORK="safebox-net"
SAFEBOX_BRIDGE="virbr-safebox"
SAFEBOX_INSTALL_NETWORK_NAME="safebox-install-net"
SAFEBOX_INSTALL_BRIDGE="virbr-safebox-inst"
SAFEBOX_GUEST_IP="10.77.0.100"
SAFEBOX_GATEWAY="10.77.0.1"
SAFEBOX_PREFIX="24"
SAFEBOX_MAC="52:54:00:77:00:10"
SAFEBOX_NWFILTER="safebox-runtime-filter"
SAFEBOX_INSTALL_NWFILTER="safebox-install-filter"
SAFEBOX_NWFILTER_BASELINE="/etc/safebox/nwfilter.sha256"
SAFEBOX_NWFILTER_XML="/etc/safebox/safebox-runtime-filter.xml"
SAFEBOX_INSTALL_NWFILTER_XML="/etc/safebox/safebox-install-filter.xml"
SAFEBOX_EXPECTED_QEMU_USER="libvirt-qemu"
SAFEBOX_DISK_BUS="sata"
SAFEBOX_DISK_TARGET="sda"
SAFEBOX_NET_MODEL="e1000e"
SAFEBOX_QEMU_CONF="/etc/libvirt/qemu.conf"
SAFEBOX_LIBEXEC="/usr/local/libexec/safebox"
SAFEBOX_INSTALLED_CONFIG="/etc/safebox/defaults.conf"

# Security gates from Stage 1.
SAFEBOX_NET_BACKEND="qemu"
SAFEBOX_QEMU_MIN_VERSION="10.0.13"
# Hardened default avoids the currently open virtio-net/virtio-blk paths by using e1000e + SATA.
SAFEBOX_QEMU_MIN_NETWORK_VERSION="10.0.14"
SAFEBOX_QEMU_BLOCK_11_BELOW="11.1.2"

# Release signing: must be configured explicitly before publishing.
SAFEBOX_RELEASE_SIGNER_FINGERPRINT=""
