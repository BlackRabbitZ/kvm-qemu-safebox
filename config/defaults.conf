# KVM-QEMU-SafeBox – zentrale Standardwerte
SAFEBOX_PROJECT_NAME="KVM-QEMU-SafeBox"
SAFEBOX_VERSION="0.2.1"

# Runtime-Netz: kein DHCP/DNS-Dienst auf dem Host; der Gast nutzt statische IPv4.
SAFEBOX_NETWORK="safebox-net"
SAFEBOX_BRIDGE="virbr-safebox"

# Installationsnetz: nur für die vertrauenswürdige Debian-Erstinstallation.
SAFEBOX_INSTALL_NETWORK_NAME="safebox-install-net"
SAFEBOX_INSTALL_BRIDGE="virbr-safebox-inst"

SAFEBOX_SUBNET="10.77.0.0/24"
SAFEBOX_PREFIX="24"
SAFEBOX_GATEWAY="10.77.0.1"
SAFEBOX_GUEST_IP="10.77.0.100"
SAFEBOX_MAC="52:54:00:77:00:10"
SAFEBOX_NWFILTER="clean-traffic"

# Öffentliche Resolver für den Runtime-Gast. Private/LAN-Resolver sind absichtlich
# ungeeignet, weil der Host-Guard RFC1918/Sondernetze blockiert.
SAFEBOX_DNS_PRIMARY="9.9.9.9"
SAFEBOX_DNS_SECONDARY="149.112.112.112"

SAFEBOX_STORAGE="/var/lib/libvirt/images/safebox"
SAFEBOX_BASE_IMAGE="/var/lib/libvirt/images/safebox/debian13-xfce-base.qcow2"
SAFEBOX_BASE_HASH="/var/lib/libvirt/images/safebox/debian13-xfce-base.qcow2.sha256"
SAFEBOX_INSTALL_ISO="/var/lib/libvirt/images/safebox/debian-installer.iso"
SAFEBOX_PERSISTENT_IMAGE="/var/lib/libvirt/images/safebox/persistent.qcow2"
SAFEBOX_SESSIONS_DIR="/var/lib/libvirt/images/safebox/sessions"
SAFEBOX_DISK_SIZE="50G"
SAFEBOX_RAM_MIB="4096"
SAFEBOX_VCPUS="2"
SAFEBOX_CONNECT_URI="qemu:///system"
SAFEBOX_QEMU_CONF="/etc/libvirt/qemu.conf"
SAFEBOX_VERIFY_BASE_HASH="1"
