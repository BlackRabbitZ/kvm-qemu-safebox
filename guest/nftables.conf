#!/usr/sbin/nft -f
flush ruleset
table inet safebox_guest {
  set blocked_v4 { type ipv4_addr; flags interval; elements = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4 } }
  chain input { type filter hook input priority 0; policy drop; iif lo accept; ct state established,related accept; }
  chain output { type filter hook output priority 0; policy accept; meta nfproto ipv6 drop; ip daddr @blocked_v4 drop; }
}
